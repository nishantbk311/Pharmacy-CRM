<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Pharmacy CRM - Clinical & Patient Management Platform</title>

    <!-- Primary Meta Tags -->
    <meta
      name="title"
      content="Pharmacy CRM - Clinical & Patient Management Platform"
    />

      name="keywords"
      content="pharmacy crm, patient management, prescription tracking, clinical pharmacy, medical records, healthcare portal, drug inventory"
    />
    <meta name="author" content="Pharmacy CRM Healthcare Systems" />
    <meta name="robots" content="index, follow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://pharmacy-crm-by-nishant-bk.vercel.app/"
    />

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://pharmacy-crm-by-nishant-bk.vercel.app/"
    />
    <meta
      property="og:title"
      content="Pharmacy CRM - Clinical & Patient Management Platform"
    />
    <meta
      property="og:description"
      content="Manage clinical pharmacy workflows, electronic prescriptions, patient records, appointments, and inventory with real-time tracking."
    />
    <meta property="og:site_name" content="Pharmacy CRM" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Pharmacy CRM - Clinical & Patient Management Platform"
    />
    <meta
      name="twitter:description"
      content="Comprehensive Pharmacy CRM and Clinical Management portal for prescription processing and patient records."
    />

    <!-- Structured Data (JSON-LD) for SEO Rich Snippets -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Pharmacy CRM",
        "url": "https://pharmacy-crm-by-nishant-bk.vercel.app/",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "All",
        "browserRequirements": "Requires JavaScript. Requires HTML5.",
        "description": "Comprehensive Pharmacy Management & CRM platform featuring 2FA login, patient & doctor management, staff directory, appointments, open inquiries, and prescription tracking.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!-- DNS Prefetch & Preconnect for Fonts -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
